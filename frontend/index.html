<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAS Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Familjen+Grotesk:wght@500;600;700&family=Martian+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader"></div>
  <div id="login-root"></div>
  <div id="shell" hidden>
    <div class="awning-wrap"><div class="awning-stripes"></div></div>
    <header class="topbar">
      <div class="sign">
        <span class="brand-mark" id="brand-icon"></span>
        <div class="sign-text"><b>SAS</b><small>Supermarket</small></div>
      </div>
      <nav id="tabs" aria-label="Main"></nav>
      <div class="user">
        <div class="avatar" id="avatar"></div>
        <div class="user-info"><strong id="who-name"></strong><span id="who-role"></span></div>
        <button id="logout" class="btn ghost icon sm" title="Log out" aria-label="Log out"></button>
      </div>
    </header>
    <main id="app"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="dlg"></dialog>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
